[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.10.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "datalayer-example"
version = "0.0.1"
description = "Generated pybind11 bindings for DataLayerGenerator"
requires-python = ">=3.9"

[tool.scikit-build]
cmake.source-dir = ".."
cmake.build-dir = "build/{wheel_tag}"
wheel.packages = []

[tool.scikit-build.cmake.define]
BUILD_EXAMPLES = "OFF"
ENABLE_TESTING = "OFF"
ENABLE_DOCS = "OFF"
ENABLE_PYBIND11 = "ON"
