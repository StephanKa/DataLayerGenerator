<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Layer Model Editor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='model_editor.css') }}" rel="stylesheet">
  <script>
    const storedTheme = localStorage.getItem('datalayer-editor-theme');
    document.documentElement.dataset.bsTheme = storedTheme ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
</head>
<body>
  <header class="editor-header border-bottom">
    <div class="container-fluid px-4 py-3 d-flex flex-wrap align-items-center gap-3">
      <div>
        <h1 class="h4 mb-0">Data Layer Model Editor</h1>
        <div class="small text-secondary font-monospace">{{ model_directory }}</div>
      </div>
      <div class="ms-auto d-flex align-items-center gap-2">
        <span id="validation-status" class="badge text-bg-secondary">Loading</span>
        <button id="theme-toggle" class="btn btn-outline-secondary btn-sm" type="button"
                title="Switch to dark mode" aria-label="Switch to dark mode">
          <i id="theme-icon" class="bi bi-moon-stars-fill" aria-hidden="true"></i>
        </button>
        <button id="validate-button" class="btn btn-outline-secondary btn-sm">Validate</button>
        <button id="save-button" class="btn btn-primary btn-sm">Save model</button>
      </div>
    </div>
  </header>
  <main class="container-fluid px-4 py-4">
    <div id="alert-region" aria-live="polite"></div>
    <div class="row g-4">
      <aside class="col-lg-3 col-xl-2">
        <nav id="section-navigation" class="nav nav-pills flex-column gap-1"></nav>
      </aside>
      <section class="col-lg-9 col-xl-10">
        <div class="d-flex align-items-center mb-3">
          <div>
            <h2 id="section-title" class="h4 mb-0"></h2>
            <p id="section-description" class="text-secondary mb-0"></p>
          </div>
          <button id="add-button" class="btn btn-success ms-auto">Add</button>
        </div>
        <div class="editor-table table-responsive border rounded-2">
          <table class="table table-hover align-middle mb-0">
            <thead id="item-table-header"></thead>
            <tbody id="item-table-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div class="modal fade" id="item-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <form id="item-form" class="modal-content">
        <div class="modal-header">
          <h2 id="item-modal-title" class="modal-title fs-5"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div id="item-modal-body" class="modal-body"></div>
        <div class="modal-footer">
          <button id="delete-button" type="button" class="btn btn-outline-danger me-auto">Delete</button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Apply changes</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='model_editor.js') }}"></script>
</body>
</html>
